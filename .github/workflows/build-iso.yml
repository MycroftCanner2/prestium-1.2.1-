# Prestium 2.0: build the ISO on a GitHub-hosted runner (free for public repositories).
# Native amd64, so the chroot is not emulated. The build runs in a privileged Debian 13 container,
# the host BUILDING.md asks for. The ISO and its SHA-256 are uploaded as a workflow artifact
# (kept 14 days). Nothing is published as a release.
name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [prestium-2.0]
    paths-ignore: ['**.md', 'tests/**']

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space (live-build needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/lib/jvm
          sudo docker image prune -af >/dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build in Debian 13
        run: |
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euo pipefail -c '
              apt-get update -q
              apt-get install -y -q live-build debootstrap squashfs-tools xorriso mtools dosfstools \
                curl gnupg gpgv git unzip npm python3 openssl ca-certificates
              git config --global --add safe.directory "*"
              ./build.sh
              ls -l Prestium-2.0-amd64.iso
              cat Prestium-2.0-amd64.iso.sha256
            '

      - name: Check build result
        run: |
          sudo chown -R "$(id -u):$(id -g)" Prestium-2.0-amd64.iso* build.log 2>/dev/null || true
          test -s Prestium-2.0-amd64.iso
          sha256sum -c Prestium-2.0-amd64.iso.sha256
          echo "commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 $(cut -d' ' -f1 Prestium-2.0-amd64.iso.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Prestium-2.0-amd64-${{ github.sha }}
          path: |
            Prestium-2.0-amd64.iso
            Prestium-2.0-amd64.iso.sha256
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore
