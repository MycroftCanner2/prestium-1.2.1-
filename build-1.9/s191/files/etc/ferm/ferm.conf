def $user_uid = 1000;
def $i2pd_uid = 2000;
def $tor_uid = debian-tor;
# Prestium 1.8: local-only Firefox (primary group) and The Lounge (user)
def $localweb_gid = prestium-localweb;
def $lounge_uid = thelounge;
# Prestium 1.9.1: the only 127.0.0.1 TCP ports apps running as "user" may open.
#   4444 I2P HTTP proxy (LibreWolf)   4447 I2P SOCKS (I2P apps)
#   4450 I2P "system" HTTP proxy (http_proxy in /etc/environment)
#   7659/7660 postman SMTP/POP3 tunnels (Claws Mail "Mail (I2P)")
#   9050 Tor SOCKS (Tor Browser, Gajim, Feather, torsocks)
#   17600:17650 OnionShare's own local web server (it talks to itself on stop)
# Not listed on purpose: 7070 i2pd console, 7685 I2P Torrents, 9000 The Lounge
# (local-only Firefox gid only), 7656 SAM (off), 9051/control (onion-grater only).
# The Lounge (uid thelounge) has its own rule for its IRC tunnels 6665-6672.
def $user_ports = (4444 4447 4450 7659 7660 9050 17600:17650);

domain ip {
	table filter {
		chain INPUT {
			policy DROP;

			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			interface lo ACCEPT;

		}

		chain OUTPUT {
			policy DROP;

			# Prestium 1.9.1 (Tails): never let conntrack-INVALID packets out
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			# Prestium 1.8: the local-only Firefox (prestium-localfox runs it with primary
			# group prestium-localweb) may open TCP connections only to Prestium's own
			# web pages on 127.0.0.1: i2pd console 7070, I2P Torrents 7685, The Lounge 9000.
			# Everything else (Internet, Tor/I2P proxies, other local ports) is refused.
			mod owner gid-owner $localweb_gid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport (7070 7685 9000) ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped localweb packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			# Prestium 1.8: The Lounge may reach only the i2pd IRC client tunnels.
			mod owner uid-owner $lounge_uid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport 6665:6672 ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped thelounge packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			outerface lo {
				mod state state (RELATED) proto icmp ACCEPT;

				# Prestium 1.9.1: user apps may only reach the listed local proxies/tunnels
				daddr 127.0.0.1 proto tcp syn dport $user_ports {
					mod owner uid-owner $user_uid ACCEPT;
				}

				# Prestium 1.8: clock sync (prestium-timesync) may only reach Tor's SOCKS port
				daddr 127.0.0.1 proto tcp syn dport 9050 {
					mod owner uid-owner prestium-htp ACCEPT;
				}
			}

			# i2pd needs TCP (NTCP2) and UDP (SSU2)
			mod owner uid-owner $i2pd_uid ACCEPT;
			# Prestium 1.9.1: Tor needs TCP only (obfs4/lyrebird too). Snowflake would
			# need UDP (WebRTC) plus a DNS resolver, which Prestium deliberately lacks.
			mod owner uid-owner $tor_uid proto tcp ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp-port-unreachable;
		}

		chain FORWARD {
			policy DROP;
		}
	}

	table nat {
		chain PREROUTING {
			policy ACCEPT;
		}

		chain POSTROUTING {
			policy ACCEPT;
		}

		chain OUTPUT {
			policy ACCEPT;
		}
	}
}

# Prestium 1.9.1: IPv6 is disabled (sysctl, NetworkManager, i2pd). These rules
# are the second layer: nothing may send IPv6 at all, not even to ::1.
domain ip6 {
	table filter {
		chain INPUT {
			policy DROP;
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;
		}

		chain FORWARD {
			policy DROP;
		}

		chain OUTPUT {
			policy DROP;
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp6-port-unreachable;
		}
	}
}
