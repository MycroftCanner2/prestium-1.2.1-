# TEST ISO ONLY: i2pd info log so the self-test can see where reseed came from
[Service]
ExecStart=
ExecStart=/usr/bin/i2pd --conf=/var/lib/i2pd/i2pd.conf --tunconf=/var/lib/i2pd/tunnels.conf --tunnelsdir=/var/lib/i2pd/tunnels.conf.d --pidfile=/run/i2pd/i2pd.pid --daemon --service --log=file --logfile=/var/log/i2pd/i2pd.log --loglevel=info
