# Prestium 2.0: touchpad defaults (change them per session with Menu > System > Touchpad).
Section "InputClass"
	Identifier "Prestium touchpad defaults"
	MatchIsTouchpad "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"
	Option "Tapping" "on"
	Option "NaturalScrolling" "on"
	Option "DisableWhileTyping" "on"
EndSection
