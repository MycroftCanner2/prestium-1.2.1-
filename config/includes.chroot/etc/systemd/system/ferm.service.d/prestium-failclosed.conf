# Prestium 2.0 r8: stopping ferm must never open the firewall.
# Debian's "ferm stop" runs "ferm --flush", which clears every rule and sets
# all policies to ACCEPT. That happens on "systemctl stop ferm", on
# "systemctl restart ferm" (stop runs first) and at shutdown. Replace it with
# the same drop-all (loopback only) used before ferm loads at boot.
# Reloads (ExecReload) are unchanged: they swap rules in atomically.
[Service]
ExecStop=
ExecStop=/usr/local/sbin/prestium-firewall-early
