# Prestium: i2pd built-in torrent client (see /usr/local/sbin/prestium-i2pd-torrents)
[Service]
ExecStartPre=+/usr/local/sbin/prestium-i2pd-torrents
# Drop the self-bind so a later start can recreate cleanly
ExecStopPost=+/bin/sh -c 'mountpoint -q /home/user/Downloads/Torrents && umount /home/user/Downloads/Torrents || true'
SupplementaryGroups=i2ptorrents
UMask=0007
ReadWritePaths=-/home/user/Downloads/Torrents
