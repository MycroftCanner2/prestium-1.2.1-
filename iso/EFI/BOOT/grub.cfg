insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod all_video
insmod font

set default="0"
set timeout=30

menuentry "Prestium [EFI/GRUB]" {
    search --no-floppy --set=root --label PRESTIUM
    linux ($root)/live/vmlinuz-5.10.0-20-amd64 boot=live modprobe.blacklist=ahci modprobe.blacklist=libahci modprobe.blacklist=libata noprompt block.events_dfl_poll_msecs=1000 slab_nomerge slub_debug=FZP mce=0 vsyscall=none page_poison=1 init_on_alloc=1 init_on_free=1 mds=full,nosmt quiet
    initrd ($root)/live/initrd.img-5.10.0-20-amd64
}

menuentry "Prestium [EFI/GRUB] (nomodeset)" {
    search --no-floppy --set=root --label PRESTIUM
    linux ($root)/live/vmlinuz-5.10.0-20-amd64 boot=live nomodeset modprobe.blacklist=ahci modprobe.blacklist=libahci modprobe.blacklist=libata noprompt block.events_dfl_poll_msecs=1000 slab_nomerge slub_debug=FZP mce=0 vsyscall=none page_poison=1 init_on_alloc=1 init_on_free=1 mds=full,nosmt quiet
    initrd ($root)/live/initrd.img-5.10.0-20-amd64
}
