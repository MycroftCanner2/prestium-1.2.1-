insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod all_video
insmod font

set default="0"
set timeout=30

menuentry "Prestium 1.9.1 [EFI/GRUB]" {
    search --no-floppy --set=root --label PRESTIUM
    linux ($root)/live/vmlinuz-6.12.113+deb13-amd64 boot=live loop.max_loop=64 modprobe.blacklist=ahci modprobe.blacklist=libahci modprobe.blacklist=libata noprompt block.events_dfl_poll_msecs=1000 slab_nomerge slub_debug=FZP mce=0 vsyscall=none page_poison=1 init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on pti=on mds=full,nosmt spec_store_bypass_disable=on debugfs=off intel_iommu=on amd_iommu=force_isolation iommu=force iommu.strict=1 efi=disable_early_pci_dma module.sig_enforce=1 quiet splash
    initrd ($root)/live/initrd.img-6.12.113+deb13-amd64
}

menuentry "Prestium 1.9.1 [EFI/GRUB] (nomodeset)" {
    search --no-floppy --set=root --label PRESTIUM
    linux ($root)/live/vmlinuz-6.12.113+deb13-amd64 boot=live loop.max_loop=64 nomodeset modprobe.blacklist=ahci modprobe.blacklist=libahci modprobe.blacklist=libata noprompt block.events_dfl_poll_msecs=1000 slab_nomerge slub_debug=FZP mce=0 vsyscall=none page_poison=1 init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on pti=on mds=full,nosmt spec_store_bypass_disable=on debugfs=off intel_iommu=on amd_iommu=force_isolation iommu=force iommu.strict=1 efi=disable_early_pci_dma module.sig_enforce=1 quiet splash
    initrd ($root)/live/initrd.img-6.12.113+deb13-amd64
}

menuentry "Prestium 1.9.1 [EFI/GRUB] (camera and microphone off)" {
    search --no-floppy --set=root --label PRESTIUM
    linux ($root)/live/vmlinuz-6.12.113+deb13-amd64 boot=live loop.max_loop=64 modprobe.blacklist=ahci modprobe.blacklist=libahci modprobe.blacklist=libata noprompt block.events_dfl_poll_msecs=1000 slab_nomerge slub_debug=FZP mce=0 vsyscall=none page_poison=1 init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on pti=on mds=full,nosmt spec_store_bypass_disable=on debugfs=off intel_iommu=on amd_iommu=force_isolation iommu=force iommu.strict=1 efi=disable_early_pci_dma module.sig_enforce=1 quiet splash prestium.nocammic
    initrd ($root)/live/initrd.img-6.12.113+deb13-amd64
