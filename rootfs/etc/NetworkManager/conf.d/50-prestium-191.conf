# Prestium 1.9.1
[connection]
# IPv6 is disabled on Prestium (also by sysctl and in the firewall)
ipv6.method=disabled
# MAC address: spoofed at udev time by macchanger (vendor part kept, Tails-style),
# before NetworkManager sees the device; keep that address
ethernet.cloned-mac-address=preserve
wifi.cloned-mac-address=preserve
