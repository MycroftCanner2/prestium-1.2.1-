def $user_uid = 1000;
def $i2pd_uid = 2000;
def $tor_uid = 107;
# Prestium 1.8: local-only Firefox (primary group) and The Lounge (user)
def $localweb_gid = prestium-localweb;
def $lounge_uid = thelounge;

domain ip {
	table filter {
		chain INPUT {
			policy DROP;

			mod state state (ESTABLISHED) ACCEPT;

			interface lo ACCEPT;

		}

		chain OUTPUT {
			policy DROP;

			mod state state (ESTABLISHED) ACCEPT;

			# Prestium 1.8: the local-only Firefox (prestium-localfox runs it with primary
			# group prestium-localweb) may open TCP connections only to Prestium's own
			# web pages on 127.0.0.1: i2pd console 7070, I2P Torrents 7685, The Lounge 9000.
			# Everything else (Internet, Tor/I2P proxies, other local ports) is refused.
			mod owner gid-owner $localweb_gid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport (7070 7685 9000) ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped localweb packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			# Prestium 1.8: The Lounge may reach only the i2pd IRC client tunnels.
			mod owner uid-owner $lounge_uid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport 6665:6672 ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped thelounge packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			outerface lo {
				mod state state (RELATED) proto icmp ACCEPT;

				# user apps may only reach local proxies (I2P, Tor, CUPS)
				daddr 127.0.0.1 proto tcp syn dport 1024:65535 {
					mod owner uid-owner $user_uid ACCEPT;
				}

				daddr 127.0.0.1 proto tcp syn dport 631 {
					mod owner uid-owner $user_uid ACCEPT;
				}

				# Prestium 1.8: clock sync (prestium-timesync) may only reach Tor's SOCKS port
				daddr 127.0.0.1 proto tcp syn dport 9050 {
					mod owner uid-owner prestium-htp ACCEPT;
				}
			}


			mod owner uid-owner $i2pd_uid ACCEPT;
			mod owner uid-owner $tor_uid ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp-port-unreachable;
		}

		chain FORWARD {
			policy DROP;
		}
	}

	table nat {
		chain PREROUTING {
			policy ACCEPT;
		}

		chain POSTROUTING {
			policy ACCEPT;
		}

		chain OUTPUT {
			policy ACCEPT;
		}
	}
}

domain ip6 {
	table filter {
		chain INPUT {
			policy DROP;
			mod state state (ESTABLISHED) ACCEPT;
			interface lo ACCEPT;
		}

		chain FORWARD {
			policy DROP;
		}

		chain OUTPUT {
			policy DROP;
			mod state state (ESTABLISHED) ACCEPT;
			# Prestium 1.8: no IPv6 at all for the local-only Firefox and The Lounge
			mod owner gid-owner $localweb_gid REJECT reject-with icmp6-port-unreachable;
			mod owner uid-owner $lounge_uid REJECT reject-with icmp6-port-unreachable;
			outerface lo ACCEPT;
			mod owner uid-owner $i2pd_uid ACCEPT;
			mod owner uid-owner $tor_uid ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp6-port-unreachable;
		}
	}
}
