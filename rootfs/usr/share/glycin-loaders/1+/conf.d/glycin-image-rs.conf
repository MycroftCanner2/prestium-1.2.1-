# QOI used image/x-qoi in the past as does a bunch of software.
# But now it suggests the use of image/qoi in the README.
# See: <https://github.com/phoboslab/qoi/issues/167> and
# <https://github.com/phoboslab/qoi/blob/b0b926ee70108b0113dd2718d13d2207c474ed2e/README.md#mime-type-file-extension>
