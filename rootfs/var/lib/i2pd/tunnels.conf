# Prestium 1.8: IRC client tunnels for The Lounge ("IRC (The Lounge)" in the menu).
# Destinations are b32 addresses so they work before the address book has been
# fetched. IRC2P tunnels share one I2P identity (irc2p-keys.dat), Ilita tunnels
# another (ilita-keys.dat), so the two networks can't link you. The keys are
# created fresh every boot (live system).
# The Lounge connects to 6668 (IRC2P) and 6669 (Ilita) at start; the others are
# the same networks' other servers and are listed in The Lounge as their own
# networks (disconnected, with host and port already set): select one, "Connect".
[IRC2P]
# irc.postman.i2p
type = client
address = 127.0.0.1
port = 6668
destination = hhcy7zznltay2tzwdvtd37g2inptemz3hk5zmxyi57d3sxgxbseq.b32.i2p
destinationport = 6667
keys = irc2p-keys.dat
i2p.streaming.profile = 2
inbound.quantity = 2
outbound.quantity = 2

